name: northstar-kag
services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "127.0.0.1:8888:8080"

  api:
    build: ./backend
    depends_on:
      searxng:
        condition: service_started
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      KAG_DEMO_MODE: "true"
      KAG_DATA_DIR: /data
      KAG_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SEARXNG_URL: http://searxng:8080
    volumes:
      - education_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  education_data: {}
