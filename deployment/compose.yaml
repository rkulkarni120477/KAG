# Full local stack. Dependency services start by default; the `app` profile adds the application services.
#   docker compose --env-file .env --profile app up -d --build
name: education-kag

x-backend-env: &backend_env
  SOURCE_URL: http://source:8001
  SOURCE_SERVICE_TOKEN: ${SOURCE_SERVICE_TOKEN:?Set the internal service token}
  KAG_QUEUE_MODE: redis
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set Redis password}@redis:6379/0
  KAG_VECTOR_BACKEND: qdrant
  KAG_GRAPH_BACKEND: neo4j
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set Qdrant API key}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set Neo4j password}
  BEDROCK_EMBED_MODEL_ID: ${BEDROCK_EMBED_MODEL_ID:-}
  AWS_REGION: ${AWS_REGION:?Set AWS region}
  BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
  WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
  WEB_CACHE_DAYS: ${WEB_CACHE_DAYS:-30}

services:
  qdrant:
    image: ${QDRANT_IMAGE:?Set approved Qdrant image digest}
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set Qdrant API key}
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [knowledge]
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:?Set approved Neo4j Community image digest}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set Neo4j password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null 2>&1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [knowledge]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:?Set approved Redis 8 image digest}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set Redis password}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [knowledge]
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:?Set approved Keycloak image digest}
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set local admin user}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set local admin password}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://localhost:8443/auth
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    networks: [knowledge]
    restart: unless-stopped

  opa:
    image: ${OPA_IMAGE:?Set approved OPA image digest}
    command: [run, --server, --addr=0.0.0.0:8181, /policies]
    volumes:
      - ./policies:/policies:ro
    networks: [knowledge]
    restart: unless-stopped

  source:
    profiles: [app]
    image: ${SOURCE_IMAGE:-kag-source:local}
    build:
      context: ../backend
      dockerfile: Dockerfile.source
    environment:
      SOURCE_SERVICE_TOKEN: ${SOURCE_SERVICE_TOKEN:?Set the internal service token}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: [knowledge]
    restart: unless-stopped

  api:
    profiles: [app]
    image: ${API_IMAGE:-kag-api:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      <<: *backend_env
      OIDC_ISSUER: https://localhost:8443/auth/realms/education
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/education/protocol/openid-connect/certs
      OIDC_TOKEN_URL: http://keycloak:8080/auth/realms/education/protocol/openid-connect/token
      OIDC_AUDIENCE: kag-api
      OIDC_CLIENT_ID: kag-web
      OPA_URL: http://opa:8181
      KAG_COOKIE_SECURE: "true"
      OTEL_SERVICE_NAME: kag-api
    depends_on:
      source: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_started}
      opa: {condition: service_started}
      keycloak: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks: [knowledge, egress]
    restart: unless-stopped

  worker:
    profiles: [app]
    image: ${WORKER_IMAGE:-kag-worker:local}
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    environment:
      <<: *backend_env
      OTEL_SERVICE_NAME: kag-worker
    depends_on:
      source: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_started}
    networks: [knowledge, egress]
    restart: unless-stopped

  scheduler:
    profiles: [app]
    image: ${WORKER_IMAGE:-kag-worker:local}
    command: [python, -m, app.worker, scheduler]
    environment:
      <<: *backend_env
      OTEL_SERVICE_NAME: kag-scheduler
    depends_on:
      source: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [knowledge]
    restart: unless-stopped

  web:
    profiles: [app]
    image: ${WEB_IMAGE:-kag-web:local}
    build:
      context: ../frontend
    depends_on:
      api: {condition: service_healthy}
    networks: [knowledge, egress]
    restart: unless-stopped

  gateway:
    profiles: [app]
    image: ${CADDY_IMAGE:?Set approved Caddy image digest}
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_started}
      keycloak: {condition: service_started}
    networks: [knowledge, egress]
    restart: unless-stopped

networks:
  knowledge:
    internal: true
  egress: {}

volumes:
  sqlite_data: {}
  qdrant_data: {}
  neo4j_data: {}
  neo4j_logs: {}
  redis_data: {}
  keycloak_data: {}
  caddy_data: {}
  caddy_config: {}
